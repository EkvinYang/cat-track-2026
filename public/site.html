<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job site · Cat Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    .tall { max-height: 680px; }
    .alert-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .aud { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .act-group + .act-group { margin-top: 14px; }
    .act-group h4 { font-family: var(--f-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; }
    .act-item { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
    .act-item .box { width: 18px; height: 18px; border-radius: 3px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; margin-top: 1px; }
    .act-item .box svg { width: 12px; height: 12px; stroke-width: 3; }
    .act-item:hover .box { border-color: var(--cat); }
    .act-item.done { opacity: .5; }
    .act-item.done .txt { text-decoration: line-through; }
    .act-item.done .box { background: var(--good); border-color: var(--good); color: #06150c; }
    .act-item .meta { font-size: 12px; color: var(--faint); margin-top: 2px; font-family: var(--f-mono); }
    .fleet { border-top: 1px solid var(--line); }
    .unit { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
    .unit:hover { background: var(--s2); color: var(--ink); }
    .unit .ic { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--ink-2); }
    .unit .ic svg { width: 22px; height: 22px; }
    .unit.down .ic { border-color: var(--critical); }
    .unit.attention .ic { border-color: var(--serious); }
    .unit .m { font-size: 13px; color: var(--muted); }
    .unit .tele { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
    .unit .r { text-align: right; min-width: 92px; }
    .unit .r .health { margin-top: 6px; }
    .feed-item { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
    .feed-item .src { width: 30px; height: 30px; border-radius: 3px; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--muted); }
    .feed-item .q { color: var(--ink-2); font-size: 14px; margin-top: 3px; }
    .ask-log { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .bubble { font-size: 14px; max-width: 94%; }
    .bubble.me { align-self: flex-end; background: var(--s3); border-radius: 4px; padding: 7px 11px; font-weight: 500; }
    .bubble.bot { align-self: flex-start; border-left: 2px solid var(--cat); padding: 2px 0 2px 12px; }
    .trace { margin-top: 6px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
  </style>
</head>
<body>
  <div id="top"></div>
  <div class="page">
    <div class="page-head">
      <div><div class="label" id="siteLabel">Job site</div><h1 id="siteTitle" style="margin-top:6px"><span class="sk title" style="width:420px;height:36px"></span></h1><div class="sub" id="siteSub"></div></div>
      <div class="controls">
        <select class="select" id="siteSel" style="width:auto;min-width:220px" aria-label="Job site"></select>
        <label class="switch" title="Stream simulated sensor readings from every machine"><input type="checkbox" id="teleToggle"><span class="track"></span>Simulated sensors</label>
      </div>
    </div>
    <div class="statline" id="stats"><span class="sk" style="width:180px;height:56px"></span><span class="sk line" style="width:420px"></span></div>
    <div class="grid-3">
      <div class="col">
        <div class="panel">
          <div class="panel-head"><h3>Open alerts</h3><span class="count" id="alertCount"></span></div>
          <div class="panel-body scroll tall" id="alerts"></div>
        </div>
      </div>
      <div class="col">
        <div class="panel">
          <div class="panel-head"><h3>Tasks, by who does them</h3><span class="count" id="actCount"></span></div>
          <div class="panel-body scroll" style="max-height:440px" id="actions"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Ask the record</h3><span class="count" id="aiMode"></span></div>
          <div class="panel-body">
            <div class="ask-log" id="askLog"><div class="bubble bot muted">Ask about a machine, a part, or a pattern. You can also ask it to assign a task or warn a crew, and it will do it.</div></div>
            <form class="row" id="askForm"><input class="input" id="askInput" placeholder="Which trucks have run hot this month?" autocomplete="off"><button class="btn primary">Ask</button></form>
            <div class="chips" style="margin-top:10px" id="askChips"></div>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="panel">
          <div class="panel-head"><h3>Machines</h3><span class="count" id="fleetCount"></span></div>
          <div class="panel-body"><div class="fleet" id="fleet"></div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Field log</h3><span class="count" id="graphStat"></span></div>
          <div class="panel-body scroll" style="max-height:460px" id="feed"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
