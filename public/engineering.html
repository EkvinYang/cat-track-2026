<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAT Engineering Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .controls h1 { font-size: 28px; margin-right: auto; }
    .case-list { max-height: calc(100vh - 290px); min-height: 300px; }
    .case-item { display: block; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer; color: var(--text); }
    .case-item + .case-item { margin-top: 8px; }
    .case-item.sel { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow) inset; }
    .case-item .tt { font-weight: 700; margin-top: 5px; }
    .case-item .mm { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .prio { font-family: var(--font-cond); font-weight: 800; font-size: 13px; padding: 1px 8px; border-radius: 6px; letter-spacing: .05em; }
    .prio.P1 { background: var(--critical); color: #fff; }
    .prio.P2 { background: var(--high); color: #1d0e00; }
    .prio.P3 { background: #3a3f46; color: var(--text); }
    .detail-head h2 { font-size: 30px; line-height: 1.1; }
    .ev-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
    @media (max-width: 1200px) { .ev-grid { grid-template-columns: 1fr; } }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 6px; }
    .bar-row .lab { width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-row .bar { flex: 1; height: 8px; background: #262a2f; border-radius: 99px; overflow: hidden; }
    .bar-row .bar i { display: block; height: 100%; background: var(--info); border-radius: 99px; }
    .ev { padding: 11px 13px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
    .ev + .ev { margin-top: 8px; }
    .ev .q { font-size: 15px; margin-top: 4px; }
    .ev img { max-width: 160px; border-radius: 8px; margin-top: 6px; border: 1px solid var(--line); }
    .fix-row { padding: 10px 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
    .fix-row + .fix-row { margin-top: 8px; }
    .conf { height: 7px; border-radius: 99px; background: #262a2f; overflow: hidden; margin-top: 7px; }
    .conf i { display: block; height: 100%; background: var(--low); }
    .ai-box { padding: 14px; border-radius: 12px; border: 1px solid rgba(180,140,255,.4); background: rgba(180,140,255,.06); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 1200px) { .two { grid-template-columns: 1fr; } }
    .timeline-status { display: flex; gap: 0; margin-top: 12px; }
    .timeline-status span { flex: 1; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 6px 4px; background: #1d2024; color: var(--faint); border-right: 1px solid var(--bg); }
    .timeline-status span:first-child { border-radius: 8px 0 0 8px; }
    .timeline-status span:last-child { border-radius: 0 8px 8px 0; border-right: none; }
    .timeline-status span.on { background: var(--yellow); color: var(--yellow-ink); }
    .timeline-status span.past { background: rgba(255,205,17,.25); color: var(--yellow); }
  </style>
</head>
<body>
  <div id="top"></div>
  <div class="page">
    <div class="controls">
      <h1>CAT Engineering · Field Issue Intelligence</h1>
      <select class="select" id="statusFilter" style="width:auto">
        <option value="open">Open cases</option><option value="all">All cases</option><option value="new">New</option><option value="investigating">Investigating</option><option value="quick_fix_issued">Quick fix issued</option><option value="product_update">Product update</option><option value="closed">Closed</option>
      </select>
      <select class="select" id="engineerSel" style="width:auto"></select>
    </div>
    <div class="kpis" id="kpis" style="margin-bottom:16px"></div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h3>Fleet cases</h3><span class="muted" style="font-size:13px" id="caseCount"></span></div>
        <div class="panel-body scroll case-list" id="cases"></div>
      </div>
      <div class="panel panel-pad" id="detail"><div class="empty">Select a case.</div></div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/engineering.js"></script>
</body>
</html>
