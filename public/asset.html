<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Memory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 18px; }
    .hero .ico { width: 76px; height: 76px; border-radius: 16px; background: var(--yellow); color: var(--yellow-ink); display: grid; place-items: center; }
    .hero .ico svg { width: 50px; height: 50px; stroke-width: 1.7; }
    .hero h1 { font-size: 36px; line-height: 1; }
    .facts { display: grid; grid-template-columns: repeat(6, minmax(90px, 1fr)); gap: 10px; margin-top: 12px; }
    .fact .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
    .fact .v { font-family: var(--font-cond); font-size: 21px; font-weight: 700; }
    .ring { width: 104px; height: 104px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-cond); font-weight: 800; font-size: 28px; line-height: 1; }
    .ring .val small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .1em; font-family: var(--font); font-weight: 700; }
    .cols { display: grid; grid-template-columns: 360px 1fr 380px; gap: 16px; margin-top: 16px; }
    @media (max-width: 1250px) { .cols { grid-template-columns: 1fr 1fr; } .cols > :last-child { grid-column: 1 / -1; } }
    @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; } .facts { grid-template-columns: repeat(3, 1fr); } }
    .tabs { display: flex; gap: 4px; background: #0f1113; border: 1px solid var(--line); border-radius: 11px; padding: 4px; }
    .tabs button { flex: 1; border: none; background: transparent; padding: 7px 6px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; }
    .tabs button.on { background: var(--yellow); color: var(--yellow-ink); }
    .ins { padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
    .ins + .ins { margin-top: 8px; }
    .ins.high { border-color: rgba(255,77,79,.5); }
    .ins.medium { border-color: rgba(255,138,31,.45); }
    .ins .tt { font-weight: 700; font-size: 14px; }
    .ins .dd { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .mem { display: flex; gap: 9px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .mem:last-child { border-bottom: none; }
    .mem .icon { color: var(--yellow); margin-top: 2px; }
    .tl { position: relative; padding-left: 26px; }
    .tl::before { content: ''; position: absolute; left: 10px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
    .tl-item { position: relative; padding: 0 0 16px; }
    .tl-item .dot { position: absolute; left: -22px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--faint); border: 3px solid var(--bg); }
    .tl-item.critical .dot { background: var(--critical); } .tl-item.high .dot { background: var(--high); } .tl-item.medium .dot { background: var(--medium); } .tl-item.low .dot { background: var(--low); }
    .tl-item.maintenance .dot { background: var(--info); }
    .tl-item .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .tl-item .sm { font-weight: 700; margin-top: 3px; }
    .tl-item .qt { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .filters button { cursor: pointer; }
    .filters button.on { border-color: var(--yellow); color: var(--yellow); }
    #mini { height: 300px; border-radius: 12px; background: #0f1113; border: 1px solid var(--line); }
    .ask-log { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .bubble { padding: 9px 12px; border-radius: 12px; font-size: 14px; max-width: 92%; }
    .bubble.me { align-self: flex-end; background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
    .bubble.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); }
    .trace { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .trace span { font-size: 11px; font-family: ui-monospace, Menlo, monospace; color: var(--purple); background: rgba(180,140,255,.08); border: 1px solid rgba(180,140,255,.3); border-radius: 6px; padding: 1px 6px; }
    .qr-mini { width: 92px; height: 92px; background: #fff; border-radius: 10px; padding: 4px; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div class="page">
    <div class="panel hero" id="hero"><div class="empty">Loading machine memory…</div></div>
    <div class="cols">
      <div class="stack">
        <div class="panel panel-pad">
          <div class="row spread" style="margin-bottom:10px"><h3>Insights for</h3></div>
          <div class="tabs" id="roleTabs"><button data-r="operator" class="on">Operator</button><button data-r="technician">Technician</button><button data-r="fleet_manager">Fleet manager</button></div>
          <div id="insights" style="margin-top:12px"></div>
        </div>
        <div class="panel panel-pad"><h3 style="margin-bottom:6px">What this machine remembers</h3><div id="memory"></div></div>
        <div class="panel panel-pad"><h3 style="margin-bottom:8px">Open alerts & tasks</h3><div id="openItems"></div></div>
      </div>
      <div class="panel panel-pad">
        <div class="row spread" style="margin-bottom:10px"><h3>Lifecycle memory</h3><span class="muted" style="font-size:13px" id="tlCount"></span></div>
        <div class="filters" id="filters"></div>
        <div class="tl" id="timeline"></div>
      </div>
      <div class="stack">
        <div class="panel panel-pad">
          <div class="row spread" style="margin-bottom:10px"><h3>Ask this machine</h3><span class="pill sev-info" id="aiMode"></span></div>
          <div class="ask-log" id="askLog"></div>
          <form class="row" id="askForm"><input class="input" id="askInput" placeholder="Has this happened before?" autocomplete="off"><button class="btn primary">Ask</button></form>
          <div class="chips" style="margin-top:8px" id="askChips"></div>
        </div>
        <div class="panel panel-pad"><div class="row spread" style="margin-bottom:8px"><h3>Memory graph</h3><a id="graphLink" href="/graph" style="font-size:13px">Open full graph →</a></div><div id="mini"></div></div>
      </div>
    </div>
  </div>
  <script src="/vendor/vis-network/vis-network.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/asset.js"></script>
</body>
</html>
